name: CI

# Test gate for every PR and push. PERF-1550: the single monolithic test job
# (~11 min wall) is split into independent parallel jobs so the CI wall clock
# is the slowest shard, not the sum of the suite:
#   plan        — computes the test/e2e matrices (affected-only on PRs via the
#                 workspace dependency graph, full on push/dispatch) and owns
#                 the shard-coverage guard
#   quality     — changed-file gates, licenses, lint, typecheck (incl. i18n)
#   native      — Rust xlsx-sidecar unit tests, release build, compat gate
#   test (xN)   — workspace-sharded vitest; docs and sheets additionally shard
#                 their vitest suites in half (--shard=n/2)
#   e2e (x3)    — native Playwright shards; each leg builds the apps in
#                 parallel (tools/run-workspaces.mjs build)
# Packaging/signing is handled by separate release automation — this workflow
# never builds installers. Baseline authority for the visual e2e suite is
# unchanged: same config, fonts and serial per-file execution.

on:
  push:
    branches: [main, 'dev_*', 'release_*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    # Affected-only planner (PERF-1550 phase 2, tools/ci-plan.mjs): PRs run
    # just the test/e2e legs their changes can reach; push and workflow_dispatch
    # always get the full set, so the dispatch path is never weakened. Anything
    # that cannot be attributed to a workspace (root configs, .github, tools,
    # e2e specs, ...) fails wide to the full matrix.
    # Also owns the shard-coverage guard: the full matrix is validated against
    # the canonical workspace order on every run, so a new workspace missing
    # from a group fails the plan instead of silently never running in CI.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      test: ${{ steps.plan.outputs.test }}
      e2e: ${{ steps.plan.outputs.e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Depth 2 is exactly the PR merge commit + its first parent (the base
          # revision), which is all the affected-diff needs. No npm ci — the
          # planner is plain node + git, keeping this leg (and the matrix jobs
          # chained behind it) fast.
          fetch-depth: 2

      - name: Plan affected matrices
        id: plan
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node tools/ci-plan.mjs

  quality:
    # Everything that gates a PR without running workspace test suites or
    # building native/bundles. No Rust toolchain needed: cargo-deny ships its
    # own prebuilt binary.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The format/theme/hygiene gates diff changed files against the PR
          # base (HEAD^1 of the merge commit), which needs history.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve Electron version (cache key)
        id: electron-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/electron'].version")" >> "$GITHUB_OUTPUT"

      # Electron's postinstall (install-electron) downloads the binary zip on
      # every npm ci otherwise. Keyed on the lockfile-pinned version, so a
      # bump refills it instead of masking a broken install.
      - name: Cache Electron binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-v${{ steps.electron-version.outputs.version }}

      - name: Install dependencies
        run: npm ci

      - name: Check dependency licenses
        run: npm run licenses

      - name: Check for Genspark egress leftovers
        run: npm run check:no-genspark

      - name: Check Rust dependency licenses (xlsx-sidecar)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses
          manifest-path: apps/sheets/native/xlsx-engine/Cargo.toml

      - name: Check formatting
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        # For PRs the checkout is the PR merge commit, so its first parent is the
        # exact main revision the merge was built against. The event's base.sha can
        # lag behind a fast-moving main, which pulls unrelated main-side files into
        # the changed-file set and fails the check on files the PR never touched.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FORMAT_BASE_REF=$(git rev-parse HEAD^1)
          fi
          npm run format:check

      - name: Check theme colors
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FORMAT_BASE_REF=$(git rev-parse HEAD^1)
          fi
          npm run check:theme-colors

      # Added lines only: Han text outside locale tables, review-tool tags,
      # feedback-ledger ids, sample-corpus ids, internal PR numbers, personal
      # paths/e-mails, credentials, NUL bytes (tools/check-public-hygiene.mjs).
      - name: Check public-repo hygiene
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FORMAT_BASE_REF=$(git rev-parse HEAD^1)
          fi
          if [ -f tools/check-public-hygiene.mjs ]; then
            node tools/check-public-hygiene.mjs
          else
            echo "public-hygiene gate not present in this checkout; skipped"
          fi

      # Keep tracked code comments and contributor-facing documentation
      # English-only; functional CJK strings and AI prompt examples are allowed.
      - name: Check comments/docs are English-only
        run: npm run check:english-comments

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Regenerate test fixtures
        run: npm run fixtures

      # Generation is byte-deterministic (zip entry mtimes are pinned in
      # tests/helpers/build-docx.ts); a diff here means the generator and the
      # committed fixtures have drifted apart.
      - name: Check committed fixtures match the generator
        run: git diff --exit-code -- fixtures/generated

  native:
    # Rust gate for the xlsx-sidecar: cargo unit tests, the release build and
    # the sheets fixture/compatibility gates (which spawn the freshly built
    # binary). The test matrix's sheets legs rebuild via the same rust-cache,
    # so no artifact hand-off is needed.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve Electron version (cache key)
        id: electron-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/electron'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Electron binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-v${{ steps.electron-version.outputs.version }}

      - name: Setup Rust
        # SHA-pinned (third-party action); the ref no longer selects the
        # toolchain, so it is passed explicitly.
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable

      - name: Cache cargo (xlsx-sidecar)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/sheets/native/xlsx-engine

      - name: Install dependencies
        run: npm ci

      - name: Rust unit tests (xlsx-sidecar)
        run: npm run native:test -w @airy-office/sheets

      - name: Rust release build (xlsx-sidecar)
        run: npm run native:build -w @airy-office/sheets

      # Preservation gate: a no-op-adjacent edit through the OOXML gateway must
      # leave every untouched package entry byte-identical (fails closed otherwise).
      - name: Sheets compatibility gate
        run: |
          npm run fixtures -w @airy-office/sheets
          npm run compat -w @airy-office/sheets

  test:
    name: test (${{ matrix.name }})
    needs: plan
    # Workspace-sharded unit tests: the wall is the slowest shard, not the
    # whole suite. docs and sheets dominate the suite (over half the CI test
    # runtime between them), so each splits its vitest suite in half with the
    # native --shard flag; sheets legs also rebuild the Rust sidecar (vitest
    # spawns it). The legs come from the plan job: the full six on push and
    # workflow_dispatch, the affected subset on pull_request. An empty include
    # (nothing unit-testable changed) skips the job.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.test) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve Electron version (cache key)
        id: electron-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/electron'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Electron binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-v${{ steps.electron-version.outputs.version }}

      - name: Setup Rust
        if: matrix.rust == true
        # SHA-pinned (third-party action); the ref no longer selects the
        # toolchain, so it is passed explicitly.
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable

      - name: Cache cargo (xlsx-sidecar)
        if: matrix.rust == true
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/sheets/native/xlsx-engine

      - name: Install dependencies
        run: npm ci

      # Sheets vitest spawns target/release/xlsx-sidecar directly (warm
      # rust-cache makes this a single-crate rebuild).
      - name: Build xlsx-sidecar (release)
        if: matrix.rust == true
        run: npm run native:build -w @airy-office/sheets

      # Vitest-native sharding for the two heavyweight suites: run from the
      # workspace directory (same cwd the `test` script gets via npm -w) and
      # split its test files with the native --shard flag.
      - name: Test (vitest shard)
        if: matrix.vitestShard
        run: |
          cd apps/${{ matrix.workspaces }}
          npx vitest run --shard=${{ matrix.vitestShard }}

      - name: Test (workspace shard)
        if: '!matrix.vitestShard'
        run: node tools/run-workspaces.mjs test --only ${{ matrix.workspaces }}

  e2e:
    name: e2e (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: plan
    # 22.04, not -latest: 24.04's AppArmor hardening blocks Electron renderer
    # spawn under xvfb even with --no-sandbox and the userns sysctl lifted.
    # Native Playwright shards: same config/fonts/serial per-file execution as
    # before, files partitioned across the matrix (baseline authority intact).
    # Three shards (phase 2) put the e2e minutes, the pipeline wall, at ~65s of
    # tests per leg. Each leg builds the apps in parallel (run-workspaces
    # build); a build-once artifact job was re-evaluated at three shards and
    # still loses ~1.5m: the legs would chain behind the build job's own setup
    # + build + upload (~2.5m warm) and still need their full npm ci + Electron
    # runtime download afterwards, while per-leg parallel builds cost ~55s each
    # and run concurrently with nothing (see LOGS/PERF-1550-phase2.md). Empty
    # include (no app workspace affected on a PR) skips the job.
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      # electron's install.js reads exactly this var for its download cache
      # (@electron/get); it must match the actions/cache path below.
      electron_config_cache: ~/.cache/electron
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.e2e) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve Electron version (cache key)
        id: electron-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/electron'].version")" >> "$GITHUB_OUTPUT"

      # Electron's postinstall (install-electron) downloads the binary zip on
      # every npm ci otherwise. Keyed on the lockfile-pinned version, so a
      # bump refills it instead of masking a broken install.
      - name: Cache Electron binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-v${{ steps.electron-version.outputs.version }}

      - name: Setup Rust
        # SHA-pinned (third-party action); the ref no longer selects the
        # toolchain, so it is passed explicitly.
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable

      - name: Cache cargo (xlsx-sidecar)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/sheets/native/xlsx-engine

      - name: Install dependencies
        run: npm ci

      # Parallel replacement for the serial `npm run build:all` chain (the
      # app builds are independent — they only reference each other's output
      # at runtime).
      - name: Build apps
        run: node tools/run-workspaces.mjs build --concurrency 3

      # PERF-903 (completes PERF-501): sheets renderer bundle-size gate.
      # PERF-1001: docs joins the gate with an entry-chunk budget (2,200 kB,
      # ~10% headroom over the ~2.0 MB entry PERF-904 landed), and the JSON
      # artifacts are captured with `npm run --silent` — npm's run banner
      # used to land in the redirected stdout, making bundle-sizes.json
      # invalid (and machine-undiffable). The parallel build above already
      # produced both out/renderer trees, so this step only reads the chunks;
      # every invocation exits non-zero on a budget violation, failing the
      # shard before the (slower) e2e minutes are spent.
      - name: Bundle-size report (budget gate)
        if: matrix.shard == 1
        run: |
          mkdir -p reports
          npm run --silent bundle-report -w @airy-office/sheets -- --json > reports/sheets-bundle-sizes.json
          cat reports/sheets-bundle-sizes.json
          npm run --silent bundle-report -w @airy-office/docs -- --json > reports/docs-bundle-sizes.json
          cat reports/docs-bundle-sizes.json
          npm run bundle-report -w @airy-office/sheets
          npm run bundle-report -w @airy-office/docs

      - name: Upload bundle-size report
        if: matrix.shard == 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-sizes
          path: |
            reports/sheets-bundle-sizes.json
            reports/docs-bundle-sizes.json
          retention-days: 30

      - name: Generate sheets fixtures
        run: npm run fixtures -w @airy-office/sheets

      # Newer Ubuntu kernels ship an AppArmor policy that blocks unprivileged
      # user namespaces, which kills the Chromium zygote even with --no-sandbox
      # (window opens, renderer never loads). The knob only exists on kernels
      # that enforce the restriction, so skip it where it is absent instead of
      # failing the job (22.04 runner images vary by kernel).
      - name: Allow unprivileged user namespaces (Electron)
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "kernel.apparmor_restrict_unprivileged_userns not present — skipping"
          fi

      # Pixel baselines (docs-visual.spec.ts) depend on the font stack: pin
      # Calibri/Cambria metric-compatible faces and CJK glyphs so renders are
      # reproducible across runner images and contributor machines.
      - name: Install document fonts (visual baselines)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-crosextra-carlito fonts-crosextra-caladea fonts-noto-cjk

      # Electron needs a display server on Linux runners. DEBUG=pw:browser
      # forwards the Electron process stdout/stderr into the CI log so launch
      # failures are diagnosable. Playwright partitions spec files across the
      # matrix shards; workers stay 1 (serial) per shard.
      - name: E2E (Electron shell)
        env:
          DEBUG: 'pw:browser'
        run: xvfb-run --auto-servernum -- npm run test:e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts-shard-${{ matrix.shard }}
          path: |
            e2e/artifacts
            e2e/test-results
          retention-days: 7
